<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#061426">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Projeto Esquina da Carne | Primax Group. Apresentação em desenvolvimento.">
  <title>Esquina da Carne × Primax Group | Projeto</title>
  <link rel="icon" href="/assets/primax-icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {color-scheme:dark;--blue:#49c7ff;--line:rgba(120,196,246,.26);--light:#f4f9ff;--muted:#99b5ca}
    *{box-sizing:border-box}
    body{margin:0;min-height:100dvh;display:grid;place-items:center;overflow-x:hidden;background:radial-gradient(ellipse at 75% 18%,#10416b 0%,transparent 45%),radial-gradient(ellipse at 12% 90%,#17224e 0%,transparent 44%),#03101f;color:var(--light);font-family:"DM Sans",sans-serif}
    body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(#86cfff0b 1px,transparent 1px),linear-gradient(90deg,#86cfff0b 1px,transparent 1px);background-size:54px 54px}
    .wrap{width:min(920px,calc(100% - 32px));position:relative;border:1px solid var(--line);border-radius:30px;background:linear-gradient(145deg,#0d2b49d9,#061525f2);padding:clamp(28px,6vw,72px);box-shadow:0 45px 110px #0008,inset 0 1px #a5dfff18;isolation:isolate}
    .brand{display:flex;align-items:center;gap:14px;margin-bottom:clamp(32px,6vw,68px);width:max-content;max-width:100%}
    .brand img{width:52px;height:52px;object-fit:contain}
    .brand span{font:800 14px Manrope,sans-serif;letter-spacing:.07em}
    .brand small{display:block;margin-top:3px;font:600 9px "DM Sans",sans-serif;letter-spacing:.18em;color:#85bdda}
    .eyebrow{font:800 11px Manrope,sans-serif;letter-spacing:.25em;text-transform:uppercase;color:var(--blue);margin:0 0 16px}
    h1{font:800 clamp(42px,8vw,80px)/1.06 Manrope,sans-serif;letter-spacing:-.055em;margin:0 0 20px}
    h1 span{display:block;color:#65d5ff}
    p{color:var(--muted);max-width:620px;font-size:clamp(15px,2.3vw,19px);line-height:1.7;margin:0}
    .divider{width:90px;height:3px;background:linear-gradient(90deg,#fc8c36,#66d9ff);border-radius:5px;margin:30px 0}
    .status{display:inline-flex;align-items:center;gap:11px;margin-top:30px;padding:10px 14px;border:1px solid #3b779a;border-radius:999px;background:#0b2d46;color:#cceafa;font-weight:700;font-size:11px;letter-spacing:.06em}
    .status::before{content:"";width:8px;height:8px;border-radius:50%;background:#61d6ff;box-shadow:0 0 14px #32c8ff}
    footer{color:#7998b1;font-size:11px;margin-top:clamp(50px,9vw,90px)}
    @media(max-width:600px){.wrap{min-height:calc(100dvh - 24px);border-radius:20px;padding:30px 24px;display:flex;flex-direction:column;justify-content:center}.brand{margin-bottom:50px}footer{margin-top:70px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="brand">
      <img src="/assets/primax-mark.png" alt="Símbolo da Primax Group" width="52" height="52">
      <span>PRIMAX GROUP<small>SOLUÇÕES INTEGRADAS</small></span>
    </div>
    <p class="eyebrow">Novo projeto • Primax Group</p>
    <h1>Esquina da <span>Carne.</span></h1>
    <div class="divider" aria-hidden="true"></div>
    <p>Uma nova apresentação está sendo desenvolvida. O conteúdo, a estrutura comercial e os elementos visuais serão definidos para este projeto.</p>
    <div class="status">APRESENTAÇÃO EM DESENVOLVIMENTO</div>
    <footer>Esquina da Carne × Primax Group</footer>
  </main>
</body>
</html>
