<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#092746"><title>Marcela IA | Primax Group</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#eaf2fa;color:#0b2445;font-family:'DM Sans',sans-serif}.shell{max-width:650px;margin:auto;height:100svh;display:flex;flex-direction:column;background:#eef5fc;box-shadow:0 0 60px #082b4b22}.head{background:linear-gradient(110deg,#061d38,#103f6b);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:11px;flex-shrink:0;min-height:84px}.back{color:white;text-decoration:none;font-size:30px;line-height:1;padding:3px}.avatar{width:47px;height:47px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#fff,#c8e2ff);color:#0875e9;font:italic 900 26px Manrope}.head strong{display:block;font:800 18px Manrope}.head small{display:block;color:#c5d9f0;margin-top:3px;font-size:12px}.pill{font-size:10px;background:#1556a7;color:white;border-radius:8px;padding:4px 7px;margin-left:5px}.menu{margin-left:auto;background:none;color:white;border:0;font-size:24px;cursor:pointer}.chat{flex:1;min-height:0;overflow-y:auto;padding:24px 16px 20px;background:radial-gradient(circle at 10% 10%,#e7f2ff 0,transparent 55%),linear-gradient(140deg,#f0f6fd,#dceaf9);display:flex;flex-direction:column;gap:12px}.today{align-self:center;background:#dbe6f2;border-radius:22px;padding:7px 15px;font-size:12px;color:#52677d;margin-bottom:10px}.bubble{max-width:88%;padding:13px 14px 10px;border-radius:18px;line-height:1.48;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;box-shadow:0 4px 16px #0e386b0b}.ai{align-self:flex-start;background:#fff;border-top-left-radius:5px}.user{align-self:flex-end;background:#096df1;color:white;border-top-right-radius:5px}.time{display:block;text-align:right;font-size:10px;opacity:.6;margin-top:5px}.quick{display:flex;gap:8px;flex-wrap:wrap;padding:0 15px 12px;background:#edf5fc}.quick button{background:white;color:#0967d9;border:1px solid #bcd7f7;border-radius:30px;padding:9px 13px;font-size:12px;font-weight:700;cursor:pointer}.quick:empty{display:none}.form{display:flex;gap:9px;padding:12px 14px max(12px,env(safe-area-inset-bottom));background:white;border-top:1px solid #dbe6f2;flex-shrink:0}.form input{flex:1;min-width:0;border:1px solid #d4e1ef;border-radius:24px;padding:13px 17px;font:16px 'DM Sans';outline:none}.form input:focus{border-color:#187af0}.form button{border:0;background:#086ef1;color:white;border-radius:50%;width:49px;height:49px;font-size:22px;cursor:pointer}.form button:disabled{opacity:.45}.phone-help{background:#fff;padding:0 17px 8px;color:#ba4b25;font-size:12px;display:none}.phone-help.visible{display:block}.form.phone-mode input{letter-spacing:1px;font-variant-numeric:tabular-nums}.hint{background:white;color:#8292a6;font-size:10px;text-align:center;padding:0 15px 10px}.typing{opacity:.7;font-style:italic}@media(min-width:700px){body{padding:20px}.shell{height:calc(100svh - 40px);border-radius:20px;overflow:hidden}} .avatar{background-image:url("/assets/banner-corporativo-primax-facilities.png");background-repeat:no-repeat;background-size:365px auto;background-position:35% 13%;border:2px solid #d9ebff;box-shadow:0 2px 12px #0003} .avatar{display:block;width:52px;height:52px;min-width:52px;object-fit:cover;object-position:center 38%;background:#e7f2ff;border:2px solid #fff;box-shadow:0 3px 12px #0004}@media(max-width:430px){.avatar{width:48px;height:48px;min-width:48px}}@media(max-width:699px){.chat{padding:17px 12px 14px}.bubble{max-width:94%;font-size:14px}.head strong{font-size:16px}.head small{font-size:10px}.quick{padding-inline:12px}.form{padding-inline:12px}.shell{height:100dvh}} </style></head><body><main class="shell"><header class="head"><a class="back" href="/facilities/atendimento" aria-label="Voltar">‹</a><img class="avatar" src="/assets/YvissonPythonprimax-groupassetsfotoperfil.png" width="52" height="52" alt="Foto de perfil da assistente virtual Marcela"><div><strong>Marcela IA <span class="pill">IA</span></strong><small>Assistente virtual · Primax Group</small></div><button class="menu" id="menu" aria-label="Voltar ao início">⋮</button></header><section class="chat" id="chat" aria-live="polite"><div class="today">Hoje</div></section><div class="quick" id="quick"></div><form class="form" id="form"><input id="message" maxlength="1800" placeholder="Escreva sua mensagem..." aria-label="Mensagem" required autocomplete="off"><button id="send" aria-label="Enviar mensagem">➤</button></form><div class="phone-help" id="phoneHelp" role="alert">Informe um celular válido com DDD: (79) 99999-9999.</div><div class="hint">Atendimento virtual para qualificação · Sujeito à avaliação da equipe</div></main><script>const chat=document.getElementById('chat'),form=document.getElementById('form'),input=document.getElementById('message'),send=document.getElementById('send'),quick=document.getElementById('quick'),messages=[],leadState={};let finished=false,phoneMode=false;const phoneHelp=document.getElementById("phoneHelp");const digits=v=>String(v).replace(/\D/g,"");const validMobile=v=>/^[1-9][0-9]9[0-9]{8}$/.test(digits(v));function maskMobile(v){let d=digits(v).slice(0,11);return d.length>2?"("+d.slice(0,2)+") "+d.slice(2,7)+(d.length>7?"-"+d.slice(7):""):d.length?"("+d:""}function setPhoneMode(active){phoneMode=active;form.classList.toggle("phone-mode",active);input.placeholder=active?"(79) 99999-9999":"Escreva sua mensagem...";input.inputMode=active?"tel":"text";input.maxLength=active?15:1800;phoneHelp.classList.remove("visible")}input.addEventListener("input",()=>{if(phoneMode)input.value=maskMobile(input.value);phoneHelp.classList.remove("visible")});function bubble(text,who){const e=document.createElement('div');e.className='bubble '+who;const content=document.createElement('span');content.textContent=text;e.appendChild(content);const time=document.createElement('small');time.className='time';time.textContent=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});e.appendChild(time);chat.appendChild(e);chat.scrollTop=chat.scrollHeight;return content}function choices(items){quick.replaceChildren();for(const item of items){const b=document.createElement('button');b.type='button';b.textContent=item.label;b.onclick=()=>{input.value=item.value;form.requestSubmit()};quick.appendChild(b)}}const params=new URLSearchParams(location.search);const subject=params.get('assunto')||'';const env=params.get('ambiente');const welcome='Olá! 💙 Sou a Marcela, assistente virtual da Primax Group. Que bom ter você aqui! Vou te ajudar a organizar sua solicitação. '+(subject?'Vi que você procura '+subject.toLowerCase()+' ':'')+(env==='casa'?'O atendimento será para sua casa. ':env==='empresa'?'O atendimento será para sua empresa. ':'')+'Me conta: o que você precisa resolver?';bubble(welcome,'ai');messages.push({role:'assistant',content:welcome});choices([{label:'🏠 Minha casa',value:'Preciso de atendimento para minha casa.'},{label:'🏢 Minha empresa',value:'Preciso de atendimento para minha empresa.'},{label:'🧹 Limpeza pós-obra',value:'Preciso de limpeza pós-obra.'},{label:'🔧 Manutenção',value:'Preciso de manutenção predial.'}]);/* Receive guided request from the main page; never claim it was registered. */
try{
 const raw=sessionStorage.getItem('primax_marcela_handoff');
 if(raw){
  sessionStorage.removeItem('primax_marcela_handoff');
  const handoff=JSON.parse(raw);
  if(handoff&&Date.now()-Number(handoff.createdAt)<30*60*1000&&handoff.service===subject){
   const phone=String(handoff.phone||'').replace(/\\D/g,'');
   if(/^[1-9][0-9]9[0-9]{8}$/.test(phone)&&String(handoff.name||'').trim()&&String(handoff.need||'').trim()&&String(handoff.location||'').trim()){
    leadState={...leadState,name:String(handoff.name).slice(0,120),phone,need:String(handoff.need).slice(0,900),location:String(handoff.location).slice(0,180),category:String(handoff.service).slice(0,100)};
    const prepared='Já preenchi estes dados no formulário: serviço '+leadState.category+'; necessidade: '+leadState.need+'; bairro/cidade: '+leadState.location+'; nome: '+leadState.name+'; WhatsApp: '+leadState.phone+'. Continue a qualificação sem repetir os dados já fornecidos.';
    input.value=prepared;
    input.placeholder='Revise os dados e toque em enviar';
    quick.replaceChildren();
   }
  }
 }
}catch(e){console.warn('Dados do formulário não puderam ser recuperados')}
document.getElementById('menu').onclick=()=>location.href='/facilities/atendimento';form.addEventListener('submit',async e=>{e.preventDefault();const text=input.value.trim();if(!text||send.disabled||finished)return;if(phoneMode&&!validMobile(text)){phoneHelp.classList.add('visible');input.focus();return}setPhoneMode(false);input.value='';quick.replaceChildren();bubble(text,'user');messages.push({role:'user',content:text});send.disabled=true;const pending=bubble('Marcela está digitando…','ai');try{const r=await fetch('/api/marcela',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:messages.slice(-22),leadState})});const raw=await r.text();let data;try{data=JSON.parse(raw)}catch(parseError){console.error('Marcela API: resposta não JSON',r.status,raw.slice(0,180));throw Error('Nossa conexão oscilou por um instante. 💙 Pode tentar novamente? Sua mensagem continua aqui.')}if(!r.ok)throw Error(data.error||'Não consegui responder agora. Tente novamente.');if(!data||typeof data.reply!=='string')throw Error('Não consegui processar a resposta agora. Pode tentar novamente?');if(data.leadState&&typeof data.leadState==="object")leadState=data.leadState;pending.textContent=data.reply;messages.push({role:'assistant',content:data.reply});if(!data.registered&&/(?:whatsapp|celular|telefone|número de contato)/i.test(data.reply)&&/(?:qual|informe|me passe|pode|preciso|confirme|corrigir|faltando)/i.test(data.reply)&&!/(?:você confirma esses dados|confirma.*registrar)/i.test(data.reply))setPhoneMode(true);if(data.registered){finished=true;input.disabled=true;send.disabled=true;input.placeholder='Atendimento finalizado • registrado no CRM'}else if(!data.needsCorrection&&/confirma esses dados|confirma.*registrar|posso registrar/i.test(data.reply)){choices([{label:'✅ Sim, confirmo',value:'Sim, confirmo os dados e autorizo registrar minha solicitação.'},{label:'✏️ Quero corrigir',value:'Quero corrigir uma informação antes de registrar.'}])}else if(/empresa ou resid|casa ou empresa|residência ou empresa/i.test(data.reply)){choices([{label:'🏠 Residência',value:'É para minha casa.'},{label:'🏢 Empresa',value:'É para minha empresa.'}])}}catch(err){pending.textContent=err.message||'Tivemos uma instabilidade rápida. 💙 Tente novamente, por favor.';messages.pop();choices([{label:'↻ Tentar novamente',value:text}])}finally{send.disabled=finished;chat.scrollTop=chat.scrollHeight;if(!finished&&window.matchMedia("(min-width:700px)").matches)input.focus()}});</script></body></html>
