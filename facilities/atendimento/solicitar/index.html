<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solicitar atendimento | Primax</title><style>*{box-sizing:border-box}body{margin:0;background:#071322;color:#13263a;font-family:Arial,sans-serif;padding:24px}.box{max-width:600px;margin:40px auto;background:#f5f8fc;border-radius:24px;padding:28px}h1{font-size:32px}.tag{color:#167fe6;font-weight:800;font-size:12px}.grid{display:grid;gap:10px}.btn{background:white;border:1px solid #d8e2ec;border-radius:14px;padding:17px;text-align:left;font-weight:700;cursor:pointer}.btn:hover{border-color:#167fe6}.back{color:#60748a;border:0;background:none;cursor:pointer;padding:0}.field{margin:14px 0}.field label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}.field input,.field textarea{width:100%;padding:14px;border:1px solid #d8e2ec;border-radius:12px;font:inherit}.field textarea{min-height:110px}.next{width:100%;padding:15px;border:0;border-radius:12px;background:#167fe6;color:white;font-weight:800;cursor:pointer}.muted{color:#60748a;line-height:1.5}</style></head><body><main class="box"><div class="tag">MARCELA • ASSISTENTE VIRTUAL PRIMAX</div><div id="app"></div></main><script>
let d={ambiente:new URLSearchParams(location.search).get('ambiente')||'',categoria:'',problema:'',nome:'',contato:'',local:''},s=d.ambiente?1:0;
const cats=['Manutenção Predial','Elétrica','Climatização','Marcenaria e Montagem','Limpeza e Higienização','Serviços Gerais','Controle de Pragas e Resíduos','Área Externa','Segurança e Instalações','Eletrodomésticos e Eletrônicos'];
function R(){let a=document.getElementById('app');if(s===0)a.innerHTML='<h1>Onde você precisa de atendimento?</h1><div class="grid"><button class="btn" onclick="env(\'casa\')">🏠 Minha casa</button><button class="btn" onclick="env(\'empresa\')">🏢 Minha empresa</button></div>';if(s===1)a.innerHTML='<button class="back" onclick="p()">← Voltar</button><h1>O que você precisa resolver?</h1><p class="muted">Escolha uma categoria.</p><div class="grid">'+cats.map((x,i)=>'<button class="btn" onclick="cat('+i+')">'+x+'</button>').join('')+'</div>';if(s===2)a.innerHTML='<button class="back" onclick="p()">← Voltar</button><h1>Conte o problema.</h1><div class="field"><label>O que está acontecendo?</label><textarea id="prob"></textarea></div><button class="next" onclick="prob()">Continuar</button>';if(s===3)a.innerHTML='<button class="back" onclick="p()">← Voltar</button><h1>Como falamos com você?</h1><div class="field"><label>Nome</label><input id="nome"></div><div class="field"><label>WhatsApp</label><input id="contato"></div><div class="field"><label>Local do atendimento</label><input id="local"></div><button class="next" onclick="dados()">Revisar solicitação</button>';if(s===4)a.innerHTML='<button class="back" onclick="p()">← Voltar</button><h1>Revise sua solicitação</h1><p class="muted"><b>Ambiente:</b> '+d.ambiente+'<br><b>Categoria:</b> '+d.categoria+'<br><b>Problema:</b> '+d.problema+'<br><b>Nome:</b> '+d.nome+'<br><b>WhatsApp:</b> '+d.contato+'<br><b>Local:</b> '+d.local+'</p><button class="next" onclick="fim()">Enviar solicitação</button>';if(s===5)a.innerHTML='<h1>✓ Solicitação recebida</h1><p class="muted">Obrigado. A equipe Primax poderá avaliar sua necessidade e dar continuidade ao atendimento.</p><a href="/facilities" class="next" style="display:block;text-align:center;text-decoration:none">Voltar à Primax</a>'}
function env(x){d.ambiente=x;s=1;R()}function cat(i){d.categoria=cats[i];s=2;R()}function p(){s--;R()}function prob(){let v=document.getElementById('prob').value.trim();if(!v)return alert('Descreva o problema.');d.problema=v;s=3;R()}function dados(){d.nome=document.getElementById('nome').value.trim();d.contato=document.getElementById('contato').value.trim();d.local=document.getElementById('local').value.trim();if(!d.nome||!d.contato||!d.local)return alert('Preencha todos os campos.');s=4;R()}function fim(){s=5;R()}R();</script></body></html>
