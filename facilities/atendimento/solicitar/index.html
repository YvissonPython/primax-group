<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marcela IA | Primax Facilities</title><style>*{box-sizing:border-box}body{margin:0;background:#071322;color:#fff;font-family:Arial,sans-serif;padding:20px}.shell{max-width:650px;margin:24px auto;background:#f5f8fc;color:#15283d;border-radius:22px;overflow:hidden}.head{background:#102d49;color:white;padding:22px;display:flex;gap:14px;align-items:center}.avatar{width:45px;height:45px;border-radius:50%;background:#2589f5;display:grid;place-items:center;font-weight:bold}.head small{display:block;color:#b7d0e9;margin-top:4px}.chat{padding:20px;height:min(65vh,560px);min-height:320px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}.bubble{max-width:85%;padding:13px 15px;border-radius:15px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}.ai{align-self:flex-start;background:white;border:1px solid #dbe5ef}.user{align-self:flex-end;background:#167fe6;color:white}.form{display:flex;gap:9px;padding:15px;background:white;border-top:1px solid #e2e8f0}.form input{flex:1;min-width:0;border:1px solid #d1dce8;border-radius:12px;padding:13px;font-size:16px}.form button{border:0;background:#167fe6;color:white;border-radius:12px;padding:12px 18px;font-weight:bold;cursor:pointer}.form button:disabled{opacity:.55}.hint{padding:0 18px 14px;background:white;font-size:12px;color:#66788a}.back{max-width:650px;margin:auto}.back a{color:#a9c4df;text-decoration:none;font-size:13px}</style></head><body><div class="back"><a href="/facilities">← Primax Facilities</a></div><main class="shell"><header class="head"><div class="avatar">M</div><div><b>Marcela IA</b><small>Assistente virtual • Primax Facilities</small></div></header><div class="chat" id="chat" aria-live="polite"></div><form class="form" id="form"><input id="message" maxlength="1800" placeholder="Escreva sua mensagem..." aria-label="Mensagem" required autocomplete="off"><button id="send">Enviar</button></form><div class="hint">Atendimento virtual para qualificação. Serviços e agendamentos sujeitos à avaliação da equipe.</div></main><script>
const chat=document.getElementById('chat'),form=document.getElementById('form'),input=document.getElementById('message'),send=document.getElementById('send'),messages=[];
function bubble(text,who){const e=document.createElement('div');e.className='bubble '+who;e.textContent=text;chat.appendChild(e);chat.scrollTop=chat.scrollHeight;return e}
const env=new URLSearchParams(location.search).get('ambiente');const welcome='Olá! Sou a Marcela, assistente virtual da Primax Facilities. '+(env==='casa'?'Entendi que é para sua casa.':env==='empresa'?'Entendi que é para sua empresa.':'')+' Como posso ajudar você hoje?';bubble(welcome,'ai');messages.push({role:'assistant',content:welcome});
form.addEventListener('submit',async e=>{e.preventDefault();const text=input.value.trim();if(!text||send.disabled)return;input.value='';bubble(text,'user');messages.push({role:'user',content:text});send.disabled=true;const pending=bubble('Marcela está digitando...','ai');try{const r=await fetch('/api/marcela',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:messages.slice(-14)})});const data=await r.json();if(!r.ok)throw Error(data.error||'Falha de conexão');pending.textContent=data.reply;messages.push({role:'assistant',content:data.reply})}catch(err){pending.textContent='Não consegui responder agora. Tente novamente em instantes.'}finally{send.disabled=false;input.focus();chat.scrollTop=chat.scrollHeight}});
</script></body></html>
